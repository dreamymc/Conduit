<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conduit - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <meta name="theme-color" content="#0d0d0d">
</head>
<body class="login-page">
  <div class="login-wrapper">
    <div class="login-card" id="login-card">
      <div class="logo-area">
        <span class="terminal-prompt">$</span>
        <span class="logo-text">Conduit</span>
      </div>
      <p class="subtitle">Secure WSL Remote Terminal Access</p>
      
      <form id="login-form">
        <div class="input-group">
          <input type="password" id="token-input" placeholder="Enter Access Token" autocomplete="current-password" aria-label="Access Token" required>
        </div>
        <button type="submit" id="submit-btn">
          <span>Connect</span>
          <svg class="arrow-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M5 13h11.86l-5.43 5.43 1.42 1.42L21.14 12l-8.29-8.29-1.42 1.42 5.43 5.43H5v2z"/></svg>
        </button>
        <p id="error-message" class="error-msg"></p>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const input = document.getElementById('token-input');
    const card = document.getElementById('login-card');
    const errorMsg = document.getElementById('error-message');
    const submitBtn = document.getElementById('submit-btn');
    const subtitle = document.querySelector('.subtitle');
    const inputGroup = document.querySelector('.input-group');

    async function authenticate(token, isAuto = false) {
      errorMsg.textContent = '';
      card.classList.remove('shake');
      if (submitBtn) {
        submitBtn.disabled = true;
      }

      if (isAuto) {
        if (subtitle) subtitle.textContent = 'Connecting directly to terminal...';
        if (inputGroup) inputGroup.style.display = 'none';
        if (submitBtn) submitBtn.style.display = 'none';
      }

      try {
        const response = await fetch('/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ token })
        });

        const data = await response.json();

        if (response.ok && data.token) {
          localStorage.setItem('conduit_token', data.token);
          // Preserve any extra query parameters (e.g. mobile=1) while stripping the token secret
          const targetParams = new URLSearchParams(window.location.search);
          targetParams.delete('token');
          const remainingQuery = targetParams.toString() ? '?' + targetParams.toString() : '';
          window.location.replace('/term' + remainingQuery);
        } else {
          if (isAuto) {
            if (subtitle) subtitle.textContent = 'Secure WSL Remote Terminal Access';
            if (inputGroup) inputGroup.style.display = '';
            if (submitBtn) submitBtn.style.display = '';
          }
          if (submitBtn) {
            submitBtn.disabled = false;
          }
          showError(data.error || 'Access denied');
        }
      } catch (err) {
        if (isAuto) {
          if (subtitle) subtitle.textContent = 'Secure WSL Remote Terminal Access';
          if (inputGroup) inputGroup.style.display = '';
          if (submitBtn) submitBtn.style.display = '';
        }
        if (submitBtn) {
          submitBtn.disabled = false;
        }
        showError('Network error. Failed to reach server.');
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const token = input.value.trim();
      if (!token) return;
      authenticate(token, false);
    });

    function showError(msg) {
      errorMsg.textContent = msg;
      // Trigger reflow to restart CSS animation
      void card.offsetWidth;
      card.classList.add('shake');
      input.value = '';
      input.focus();
    }

    // Auto-login if token is provided in URL query string, otherwise auto-redirect if already logged in
    const urlParams = new URLSearchParams(window.location.search);
    const tokenParam = urlParams.get('token');
    if (tokenParam && tokenParam.trim()) {
      authenticate(tokenParam.trim(), true);
    } else {
      const existingToken = localStorage.getItem('conduit_token');
      if (existingToken) {
        window.location.href = '/term';
      }
    }
  </script>
</body>
</html>
